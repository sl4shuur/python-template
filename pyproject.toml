[project]
name = "kaggle-starter"
version = "0.1.0"
description = "Reusable ML competition starter for Kaggle, Colab, and local experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pydantic>=2.7",
  "pydantic-settings>=2.5",
  "rich>=13.9",
  "rich-click>=1.9.7",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
notebooks = ["ipykernel>=6", "ipywidgets>=8", "nbformat>=5"]
tracking = ["wandb>=0.17"]
deep-learning = ["torch>=2.4", "lightning>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_starter"]

[tool.uv]
default-groups = ["dev"]

# Optional Kaggle image pins go here after `wheelhouse.py snapshot`.
constraint-dependencies = [
    # BEGIN kaggle-image-pins
    # END kaggle-image-pins
]

[tool.uv.sources]
torch = { index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "src/kaggle_starter/loggers/*.py",
  "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# "src/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
